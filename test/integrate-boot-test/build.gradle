plugins {
    id 'java'
}

// The JUnit Platform test setup (useJUnitPlatform + launcher alignment) is
// configured once for all subprojects in the root build.gradle.

// Keep end-to-end tests in a separate source set so the regular unit/in-process integration
// suite remains fast and does not require a running Redis instance merely for `test`/`build`.
//
// Dynamic-datasource integration tests are likewise optional and isolated (src/dynamic):
// MyBatis-Flex's Db/Row APIs resolve their session from a JVM-global registry keyed by
// datasource name, and single-datasource apps name theirs "master" too — running the
// dynamic context in the same JVM as the default-profile suite made both sides depend on
// boot order. A dedicated source set + task gives it its own JVM, so neither suite
// constrains the other, and neither runs as part of `build`.
sourceSets {
    // No explicit srcDir lines: the java plugin already maps a source set named
    // "e2e"/"dynamic" to src/<name>/java + src/<name>/resources by convention; declaring
    // them again makes the same resource file enter the Copy task twice once the
    // directory is non-empty (duplicate-entry failure).
    e2e {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    dynamic {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    e2eImplementation.extendsFrom implementation, testImplementation
    e2eRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
    dynamicImplementation.extendsFrom implementation, testImplementation
    dynamicRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
}

dependencies {
    // Use the project BOM as the single source of dependency versions.
    implementation platform(project(':bom'))

    // The whole stack comes transitively from the starter (data layer + @IntegrateBoot),
    // including the logging layer (SLF4J facade over Log4j2).
    implementation project(':module:integrate-boot-starter')
    implementation(libs.spring.boot.starter.web) {
        // The starter already excludes Logback from its own Spring Boot dependencies; this
        // app-declared starter would bring it back through its own path, so exclude it here
        // too — the pattern applications follow when adding extra Spring Boot starters.
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }

    // H2 in-memory database for the demo; no external DB needed.
    runtimeOnly(libs.h2)

    testImplementation(libs.spring.boot.starter.test)

    // Spring Boot 4 split MockMvc auto-configuration (@AutoConfigureMockMvc) out of
    // spring-boot-starter-test into a per-technology test module.
    testImplementation(libs.spring.boot.starter.webmvc.test)

    // Spring Boot 4.1's live HTTP test client is a separate module. It provides both
    // RestTestClient and @AutoConfigureRestTestClient for random-port end-to-end tests.
    e2eImplementation(libs.spring.boot.resttestclient)
}

tasks.register('e2eTest', Test) {
    description = 'Runs live HTTP end-to-end tests against the sample application.'
    group = 'verification'
    testClassesDirs = sourceSets.e2e.output.classesDirs
    classpath = sourceSets.e2e.runtimeClasspath
    shouldRunAfter test
    useJUnitPlatform()
}

// Runs only the dynamic-datasource integration tests, in their own JVM (see the
// sourceSets block above for why isolation matters). Opt-in like e2eTest: it is not
// part of `build`/`check`, run it explicitly via `task dynamic-test`.
tasks.register('dynamicTest', Test) {
    description = 'Runs the dynamic-datasource integration tests in an isolated JVM.'
    group = 'verification'
    testClassesDirs = sourceSets.dynamic.output.classesDirs
    classpath = sourceSets.dynamic.runtimeClasspath
    shouldRunAfter test
    useJUnitPlatform()
}
