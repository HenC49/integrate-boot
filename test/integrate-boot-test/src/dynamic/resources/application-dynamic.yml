# Profile for the dynamic datasource integration test. Two in-memory H2 databases are
# configured under mybatis-flex.datasource; the first (master) is the default.
#
# Script init is disabled here on purpose: the test seeds both datasources itself in
# @BeforeEach, and schema.sql/data.sql would otherwise inject the shared seed rows into the
# named in-memory databases too (they live for the whole test JVM), making the assertions
# depend on which application contexts ran before this one.
spring:
  sql:
    init:
      mode: never

integrate-boot:
  data:
    datasource:
      dynamic:
        enabled: true

mybatis-flex:
  datasource:
    master:
      url: jdbc:h2:mem:master;DB_CLOSE_DELAY=-1;MODE=MySQL
      driver-class-name: org.h2.Driver
      username: sa
      password:
    slave:
      url: jdbc:h2:mem:slave;DB_CLOSE_DELAY=-1;MODE=MySQL
      driver-class-name: org.h2.Driver
      username: sa
      password:
