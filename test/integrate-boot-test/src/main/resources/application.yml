server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Redis connection. The password is supplied at runtime (e.g. via the REDIS_PASSWORD
  # environment variable) so no secret is committed to the repository.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: always

mybatis-flex:
  # Echo SQL so the data layer wiring is observable in logs.
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
