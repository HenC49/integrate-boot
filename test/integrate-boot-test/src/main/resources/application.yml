server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

mybatis-flex:
  # Echo SQL so the data layer wiring is observable in logs.
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
