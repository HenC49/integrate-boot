# Daemon JVM criteria consumed by the Gradle wrapper: the daemon must run on Java 21.
# Gradle 9 raises the minimum daemon JVM to 17 (running Gradle on Java 8 currently prints
# a deprecation warning on every build), and this build targets 21 anyway — so the daemon
# and the compile toolchain now share the same major version.
# The wrapper matches the criteria against locally installed JDKs (the project requires
# JDK 21; see AGENTS.md). No download URLs are embedded: provisioning via the Foojay
# resolver is not wired in because api.foojay.io is unreachable from this network.
toolchainVersion=21
