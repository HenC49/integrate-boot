plugins {
    id 'java-library'
}

// Publish this module's jar + POM (see gradle/publishing.gradle).
apply from: "$rootDir/gradle/publishing.gradle"

dependencies {
    // Use the project BOM as the single source of dependency versions.
    api platform(project(':bom'))

    // Brings in Redisson + spring-boot-starter-data-redis (with Lettuce/Jedis excluded).
    // The starter auto-configures a RedissonClient and uses Redisson as the underlying
    // RedisConnectionFactory, so RedisTemplate and Redisson share the same client and the
    // same spring.data.redis.* configuration.
    api(libs.redisson.spring.boot.starter)
    api(libs.spring.boot.autoconfigure)
    // Reuses the typedObjectMapper (Jackson 3, with type info) for Redis value serialization,
    // so cached values share one consistent, date-formatted ObjectMapper with the rest of the app.
    api project(':module:integrate-boot-jackson')

    // Generates configuration property metadata so IDEs can auto-complete
    // and document the properties consumed by this module.
    annotationProcessor(libs.spring.boot.configuration.processor)
}
