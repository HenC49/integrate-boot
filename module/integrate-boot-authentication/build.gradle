plugins {
    id 'java-library'
}

// Publish this module's jar + POM (see gradle/publishing.gradle).
apply from: "$rootDir/gradle/publishing.gradle"

dependencies {
    // Use the project BOM as the single source of dependency versions.
    api platform(project(':bom'))

    api(libs.spring.boot.autoconfigure)
    // Spring Security core (AuthenticationManager, UserDetailsService, PasswordEncoder, ...).
    api(libs.spring.boot.starter.security)
    // Spring Authorization Server (bundled into Spring Security 7.1) as an OAuth2 authorization
    // server. Brings in the resource-server + JOSE + Nimbus JWT support transitively.
    api(libs.spring.boot.starter.security.oauth2.authorization.server)

    // Generates configuration property metadata so IDEs can auto-complete
    // and document the properties consumed by this module.
    annotationProcessor(libs.spring.boot.configuration.processor)

    testImplementation(libs.spring.boot.starter.test)
    // Parse token-endpoint JSON responses in the integration tests.
    testImplementation(libs.spring.boot.starter.json)
}
