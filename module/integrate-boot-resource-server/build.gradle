plugins {
    id 'java-library'
}

apply from: "$rootDir/gradle/publishing.gradle"

dependencies {
    api platform(project(':bom'))

    api(libs.spring.boot.autoconfigure)
    // Exclusions keep Boot's default Logback starter out of the published POM: the platform
    // logs via SLF4J + Log4j2 (see integrate-boot-logging).
    api(libs.spring.boot.starter.security) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    api(libs.spring.boot.starter.web) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    api(libs.spring.boot.starter.oauth2.resource.server) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }

    annotationProcessor(libs.spring.boot.configuration.processor)

    testImplementation(libs.spring.boot.starter.test)
    // Coexistence test: the authorization-server module and this module on one classpath.
    testImplementation project(':module:integrate-boot-authentication')
}
