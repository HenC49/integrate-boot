plugins {
    id 'java-library'
}

dependencies {
    // Use the project BOM as the single source of dependency versions.
    api platform(project(':bom'))

    // Aggregate the data-access layer: depending on the starter transitively
    // brings in MyBatis-Flex + datasource auto-configuration.
    api project(':module:integrate-boot-data')

    api(libs.spring.boot.starter)
}
