plugins {
    id 'java-library'
}

// Publish this module's jar + POM (see gradle/publishing.gradle).
apply from: "$rootDir/gradle/publishing.gradle"

dependencies {
    // Use the project BOM as the single source of dependency versions.
    api platform(project(':bom'))

    // Aggregate the base layer: shared plain-Java entities (ResultInfo / KeyValue)
    // usable from any layer without pulling in a framework.
    api project(':module:integrate-boot-base')

    // Aggregate the data-access layer: depending on the starter transitively
    // brings in MyBatis-Flex + datasource auto-configuration.
    api project(':module:integrate-boot-data')

    // Aggregate the Jackson layer: default date/time serialization format plus a
    // typed ObjectMapper for caches / micro-service payloads.
    api project(':module:integrate-boot-jackson')

    // Aggregate the local cache layer: depending on the starter transitively
    // brings in Caffeine + the two cache managers.
    api project(':module:integrate-boot-cache')

    // Aggregate the Redis layer: depending on the starter transitively
    // brings in Redisson + RedisTemplate (both sharing the same Redis client).
    api project(':module:integrate-boot-redis')

    // Aggregate the logging layer: SLF4J facade over a Log4j2 backend plus a default
    // log4j2.xml (console + rolling file), so every service logs the same way.
    api project(':module:integrate-boot-logging')

    // Aggregate the exception layer: the common exception hierarchy (BaseException /
    // ErrorCode and friends) plus the global @RestControllerAdvice that renders every
    // failure into the shared ResultInfo envelope. Also brings the servlet web stack
    // and Bean Validation transitively — the modules a business REST service needs.
    api project(':module:integrate-boot-exception')

    // The logging layer replaces Spring Boot's default Logback with Log4j2. Excluding
    // spring-boot-starter-logging here (the exclusion travels with the published POM)
    // keeps Logback off consumers' classpaths; the logging module's startup guard
    // reports any path that still leaks it in (e.g. starters added by the application).
    api(libs.spring.boot.starter) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}
