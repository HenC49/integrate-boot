plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Apply Spring Boot dependency management.
    api platform(libs.spring.boot.dependencies)

    api(libs.mybatis.flex.spring.boot4.starter)
    api(libs.spring.boot.starter.jdbc)
}
