plugins {
    id 'java-platform'
    id 'maven-publish'
}

// Allow importing other BOMs (e.g. spring-boot-dependencies) into this platform.
javaPlatform {
    allowDependencies()
}

// Publish under a conventional BOM artifactId. The Gradle project is named "bom", but Maven
// consumers import it as com.github.henc:integrate-boot-bom.
ext {
    mavenArtifactId = 'integrate-boot-bom'
}

dependencies {
    // Inherit the Spring Boot dependency management.
    api platform(libs.spring.boot.dependencies)

    // Declare versions managed by this BOM. Every constraint MUST carry an explicit
    // version (from the version catalog): a version-less constraint cannot be expressed
    // in a Maven POM, so Gradle silently drops it from the published BOM (warning:
    // "Maven incompatible version notation") and it manages nothing for consumers.
    // Artifacts whose versions need no pinning of our own — e.g. spring-boot-starter-
    // validation, spring-boot-starter-log4j2, spring-boot-resttestclient, slf4j-api —
    // are therefore NOT listed; consumers inherit them from the spring-boot-dependencies
    // import above. Other libraries are pinned here.
    constraints {
        // Spring Boot (versions resolved by spring-boot-dependencies)
        api(libs.spring.boot.starter)
        api(libs.spring.boot.starter.jdbc)
        api(libs.spring.boot.starter.web)
        api(libs.spring.boot.starter.test)
        api(libs.spring.boot.autoconfigure)
        api(libs.spring.boot.configuration.processor)

        // MyBatis-Flex
        api(libs.mybatis.flex.spring.boot4.starter)

        // Redis
        api(libs.redisson.spring.boot.starter)

        // XXL-JOB Core provides the executor protocol and Spring-aware lifecycle. The
        // optional scheduling module owns the application-facing adapter and management API.
        api(libs.xxl.job.core)

        // Spring Modulith backs the event module's optional reliability layer (a transactional
        // outbox for application events). Version coupling: Modulith minors track Spring Boot
        // minors — 2.1.x pairs with Boot 4.1.x; upgrading Boot to 4.2 requires Modulith 2.2+
        // in lockstep (the event module declares these as compileOnly on purpose, so the
        // artifacts never reach consumers' classpaths unless requested explicitly).
        api(libs.spring.modulith.starter.jdbc)
        api(libs.spring.modulith.events.jackson)
        api(libs.spring.modulith.events.api)
    }
}

publishing {
    publications {
        // The java-platform plugin contributes a BOM-specific publication: the generated POM
        // uses <dependencyManagement> (from the api/constraints above) rather than <dependencies>,
        // which is the format Maven expects for an importable BOM.
        register('integrateBootBom', MavenPublication).configure {
            from components.javaPlatform
            artifactId = mavenArtifactId

            // A BOM carries no sources; keep the POM self-describing.
            pom {
                name = 'integrate-boot-bom'
                description = 'Bill of Materials for integrate-boot — dependency version management'
                packaging = 'pom'
            }
        }
    }
    repositories {
        // Local staging directory shared with the library modules (root build/repo), so the
        // whole project publishes into one tree. Run e.g.
        // ./gradlew :bom:publishIntegrateBootBomPublicationToLocalStageRepository
        maven {
            name = 'localStage'
            url = rootProject.layout.buildDirectory.dir('repo')
        }
    }
}
